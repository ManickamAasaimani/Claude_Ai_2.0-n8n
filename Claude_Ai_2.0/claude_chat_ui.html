<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claude Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #2a2a38;
      --accent: #c084fc;
      --accent2: #818cf8;
      --accent-glow: rgba(192, 132, 252, 0.15);
      --text: #f0eeff;
      --muted: #6b6b80;
      --user-bubble: #1e1b2e;
      --ai-bubble: #131320;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(192,132,252,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(192,132,252,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient orbs */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(192,132,252,0.06) 0%, transparent 70%);
      top: -200px; right: -200px;
      pointer-events: none;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(0,0); }
      to { transform: translate(-40px, 40px); }
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(20px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .logo-text span {
      color: var(--accent);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .status-dot {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(74,222,128,0); }
    }

    /* Messages container */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      gap: 16px;
      padding: 40px;
      animation: fadeUp 0.6s ease;
    }

    .welcome-orb {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      box-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(192,132,252,0.08);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .welcome h2 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      font-size: 13px;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    /* Message bubbles */
    .message {
      display: flex;
      gap: 12px;
      max-width: 760px;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }

    .message.user .avatar {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .bubble {
      padding: 13px 17px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.7;
      max-width: 560px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(99,102,241,0.3);
      border-top-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .msg-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
      text-align: right;
    }

    .message.assistant .msg-meta {
      text-align: left;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.3s ease;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 14px;
      border-top-left-radius: 4px;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      position: relative;
      z-index: 10;
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px 10px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: rgba(192,132,252,0.5);
      box-shadow: 0 0 0 3px rgba(192,132,252,0.08);
    }

    #userInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      max-height: 140px;
      min-height: 22px;
    }

    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      font-size: 16px;
    }

    #sendBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    #sendBtn:active { transform: scale(0.97); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 4px;
    }

    .n8n-url-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .n8n-url-label {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    #webhookUrl {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      padding: 5px 10px;
      outline: none;
      transition: border-color 0.2s;
      max-width: 360px;
    }

    #webhookUrl:focus {
      border-color: var(--accent);
      color: var(--text);
    }

    .hint {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Error toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d1a1a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: 12px;
      padding: 10px 18px;
      border-radius: 10px;
      z-index: 100;
      animation: fadeUp 0.3s ease;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div class="logo-text">claude<span>chat</span></div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    powered by n8n
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-orb">✦</div>
    <h2>Hello, I'm Claude</h2>
    <p>Connected via your n8n workflow. Paste your webhook URL below and start chatting.</p>
    <div class="suggestions">
      <div class="suggestion-chip" onclick="suggest(this)">What can you help me with?</div>
      <div class="suggestion-chip" onclick="suggest(this)">Explain n8n workflows</div>
      <div class="suggestion-chip" onclick="suggest(this)">Write a short story</div>
      <div class="suggestion-chip" onclick="suggest(this)">Summarize a concept</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" placeholder="Type a message..." rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()" title="Send">➤</button>
  </div>
  <div class="input-footer">
    <div class="n8n-url-wrapper">
      <span class="n8n-url-label">n8n webhook:</span>
      <input type="text" id="webhookUrl" placeholder="https://your-n8n.com/webhook/claude-chat" />
    </div>
    <span class="hint">Enter ↵ to send</span>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const webhookEl = document.getElementById('webhookUrl');

  let history = [];
  let isLoading = false;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // Enter to send (Shift+Enter for newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function suggest(el) {
    inputEl.value = el.textContent;
    inputEl.focus();
  }

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function addMessage(role, content) {
    removeWelcome();
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '◎' : '✦'}</div>
      <div>
        <div class="bubble">${escapeHtml(content)}</div>
        <div class="msg-meta">${time}</div>
      </div>
    `;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar" style="background: linear-gradient(135deg, #c084fc, #818cf8); box-shadow: 0 0 12px rgba(192,132,252,0.15); width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;">✦</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    `;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function showToast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    const webhookUrl = webhookEl.value.trim();

    if (!message || isLoading) return;

    if (!webhookUrl) {
      showToast('⚠ Please enter your n8n webhook URL first');
      webhookEl.focus();
      return;
    }

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', message);
    addTyping();

    try {
      const response = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history })
      });
 
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();
      const reply = data.reply || data.response || data.text || JSON.stringify(data);

      removeTyping();
      addMessage('assistant', reply);

      // Update history for multi-turn conversation
      history.push({ role: 'user', content: message });
      history.push({ role: 'assistant', content: reply });

      // Keep last 20 turns to avoid token overflow
      if (history.length > 40) history = history.slice(-40);

    } catch (err) {
      removeTyping();
      showToast(`Error: ${err.message}. Check your webhook URL and n8n workflow.`);
      console.error(err);
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
